<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Wezesha Restock</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #1a1a2e;
        --muted: #6b7280;
        --accent: #6d5ce6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111118;
          --fg: #f0f0f5;
          --muted: #9ca3af;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .dot {
        width: 3rem;
        height: 3rem;
        border-radius: 9999px;
        background: var(--accent);
        opacity: 0.85;
        margin: 0 auto 1.25rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: var(--muted);
        margin: 0 0 1.5rem;
        max-width: 26rem;
      }
      button {
        font: inherit;
        padding: 0.6rem 1.4rem;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dot" aria-hidden="true"></div>
      <h1>You&rsquo;re offline</h1>
      <p>Wezesha Restock needs a connection to load fresh data. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
