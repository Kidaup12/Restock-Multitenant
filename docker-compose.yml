# Local dev services. Host ports 5434/6380 (default ports are taken by other
# local stacks).
#   docker compose up -d db       # postgres
#   docker compose up -d redis    # pub/sub + queues
services:
  db:
    image: postgres:16.4-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wezesha
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wezesha"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - dbdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redisdata:/data

volumes:
  dbdata:
  redisdata:
