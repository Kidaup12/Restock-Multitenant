name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  db:
    name: db — migrate, RLS isolation, typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wezesha
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wezesha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wezesha_app:wezesha_app_dev@localhost:5434/wezesha
      SERVICE_DATABASE_URL: postgresql://wezesha_service:wezesha_service_dev@localhost:5434/wezesha
      DIRECT_URL: postgresql://postgres:postgres@localhost:5434/wezesha

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run -w @wezesha/db db:generate

      - name: Apply migrations (roles, tables, policies)
        run: npm run -w @wezesha/db db:migrate:deploy

      - name: Typecheck
        run: npm run -w @wezesha/db typecheck

      - name: Tests (RLS isolation + coverage census, as wezesha_app)
        run: npm run -w @wezesha/db test

  web-tests:
    name: web — vitest suite (real db + redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wezesha
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wezesha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wezesha_app:wezesha_app_dev@localhost:5434/wezesha
      SERVICE_DATABASE_URL: postgresql://wezesha_service:wezesha_service_dev@localhost:5434/wezesha
      DIRECT_URL: postgresql://postgres:postgres@localhost:5434/wezesha
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_SECRET: ci-test-only-secret
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run -w @wezesha/db db:generate

      - name: Apply migrations (roles, tables, policies)
        run: npm run -w @wezesha/db db:migrate:deploy

      # Executes the metric-contract one-engine proof, member-visibility
      # money-blindness, plan-data and the rest of the suite against a real,
      # migrated database — logic regressions and cost leaks now fail CI.
      - name: Tests (apps/web — seeded db + redis)
        run: npm run -w web test

  worker-tests:
    name: worker — vitest suite (real db + redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wezesha
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wezesha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wezesha_app:wezesha_app_dev@localhost:5434/wezesha
      SERVICE_DATABASE_URL: postgresql://wezesha_service:wezesha_service_dev@localhost:5434/wezesha
      DIRECT_URL: postgresql://postgres:postgres@localhost:5434/wezesha
      REDIS_URL: redis://localhost:6380

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client (worker imports @wezesha/db)
        run: npm run -w @wezesha/db db:generate

      - name: Apply migrations (roles, tables, policies)
        run: npm run -w @wezesha/db db:migrate:deploy

      # Cron processors, pos/shopify sync and the realtime pipeline against a
      # real db + redis — the queue-backed paths CI only typechecked before.
      - name: Tests (apps/worker — seeded db + redis)
        run: npm run -w @wezesha/worker test

  package-tests-db:
    name: packages — ws-gateway, pos, forecast-run (real db)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wezesha
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wezesha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wezesha_app:wezesha_app_dev@localhost:5434/wezesha
      SERVICE_DATABASE_URL: postgresql://wezesha_service:wezesha_service_dev@localhost:5434/wezesha
      DIRECT_URL: postgresql://postgres:postgres@localhost:5434/wezesha

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run -w @wezesha/db db:generate

      - name: Apply migrations (roles, tables, policies)
        run: npm run -w @wezesha/db db:migrate:deploy

      # Socket authorization against the real session/membership tables — the
      # unit suite fakes the store, only this one proves the gateway's tenant bind.
      - name: Tests @wezesha/ws-gateway (auth, gateway, db-backed session auth)
        run: npm run -w @wezesha/ws-gateway test

      # Pure ingest planners plus the DB contract the planners can't prove:
      # set-semantics idempotency, ignore rules, tenant-timezone day boundary.
      - name: Tests @wezesha/pos (planners + ingest integration)
        run: npm run -w @wezesha/pos test

      # The only automated proof that the walk-forward backtest writes rows,
      # plus cold-start borrow and the owner-prior overrides.
      - name: Tests @wezesha/forecast-run (backtest, cold start, owner priors)
        run: npm run -w @wezesha/forecast-run test

  package-tests-redis:
    name: packages — realtime, queue (real redis)
    runs-on: ubuntu-latest

    # Redis only: neither suite touches Postgres, so this job skips the database
    # container and the migration steps entirely.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6380

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Event contract, the browser-bundle export boundary, the client against a
      # real ws server, and the redis → gateway → client end-to-end path.
      - name: Tests @wezesha/realtime (contract, client, gateway e2e)
        run: npm run -w @wezesha/realtime test

      # The no-overlap enqueue guard: one tenant+source can never hold two sync
      # jobs. Only provable against real Redis.
      - name: Tests @wezesha/queue (deterministic job ids + no-overlap)
        run: npm run -w @wezesha/queue test

  lint:
    name: eslint (web + worker + pos + ws-gateway)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint (apps/web)
        run: npm run -w web lint

      # The tenant-safety rule is the second guard behind RLS, and the worker
      # runs almost entirely on the BYPASSRLS client — where it is the ONLY
      # guard. It went unrun in CI until 2026-08-11, and three unscoped writes
      # had accumulated behind that gap.
      - name: Lint (apps/worker)
        run: npm run -w @wezesha/worker lint

      # Both also reach the database on the BYPASSRLS client and had no rule
      # running over them at all: the POS feed resolves a tenant from an
      # unauthenticated slug, and the gateway authorises every socket.
      - name: Lint (packages/pos)
        run: npm run -w @wezesha/pos lint

      - name: Lint (apps/ws-gateway)
        run: npm run -w @wezesha/ws-gateway lint

  web-build:
    name: web — next build
    runs-on: ubuntu-latest
    # Build-time env: pages are dynamic so nothing connects, but module init
    # (auth config, db client) requires the variables to exist.
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      SERVICE_DATABASE_URL: postgresql://build:build@localhost:5432/build
      DIRECT_URL: postgresql://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: ci-build-only-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run -w @wezesha/db db:generate

      # next build reports type errors only for what it compiles; this covers the
      # whole app tsconfig, tests included.
      - name: Typecheck (apps/web)
        run: npm run -w web typecheck

      - name: Build (apps/web)
        run: npm run -w web build

  services-typecheck:
    name: services — typecheck packages, ws-gateway, worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client (worker imports @wezesha/db)
        run: npm run -w @wezesha/db db:generate

      - name: Typecheck @wezesha/realtime
        run: npm run -w @wezesha/realtime typecheck

      - name: Typecheck @wezesha/forecast
        run: npm run -w @wezesha/forecast typecheck

      - name: Tests @wezesha/forecast (pure engine — no infra)
        run: npm run -w @wezesha/forecast test

      - name: Typecheck @wezesha/queue
        run: npm run -w @wezesha/queue typecheck

      - name: Typecheck @wezesha/pos
        run: npm run -w @wezesha/pos typecheck

      - name: Typecheck @wezesha/forecast-run
        run: npm run -w @wezesha/forecast-run typecheck

      - name: Typecheck @wezesha/shopify
        run: npm run -w @wezesha/shopify typecheck

      - name: Tests @wezesha/shopify (hmac, oauth, crypto, sales — no infra)
        run: npm run -w @wezesha/shopify test

      - name: Typecheck @wezesha/observability
        run: npm run -w @wezesha/observability typecheck

      - name: Tests @wezesha/observability (mocked transport — no infra)
        run: npm run -w @wezesha/observability test

      - name: Typecheck @wezesha/ws-gateway
        run: npm run -w @wezesha/ws-gateway typecheck

      - name: Typecheck @wezesha/worker
        run: npm run -w @wezesha/worker typecheck

  docker-build:
    name: docker — web + service images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ws-gateway image
        run: docker build -f apps/ws-gateway/Dockerfile -t wezesha-ws-gateway:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t wezesha-worker:ci .

      # web imports @wezesha/db + auth: the image build runs next build, which
      # broke silently once the app wired those in. Cover it here so it can't
      # rot unnoticed (build-time env lives in the Dockerfile).
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t wezesha-web:ci .
