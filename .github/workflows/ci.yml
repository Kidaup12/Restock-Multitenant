name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  db:
    name: db — migrate, RLS isolation, typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wezesha
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wezesha"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wezesha_app:wezesha_app_dev@localhost:5434/wezesha
      SERVICE_DATABASE_URL: postgresql://wezesha_service:wezesha_service_dev@localhost:5434/wezesha
      DIRECT_URL: postgresql://postgres:postgres@localhost:5434/wezesha

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run -w @wezesha/db db:generate

      - name: Apply migrations (roles, tables, policies)
        run: npm run -w @wezesha/db db:migrate:deploy

      - name: Typecheck
        run: npm run -w @wezesha/db typecheck

      - name: Tests (RLS isolation + coverage census, as wezesha_app)
        run: npm run -w @wezesha/db test

  web-build:
    name: web — next build
    runs-on: ubuntu-latest
    # Build-time env: pages are dynamic so nothing connects, but module init
    # (auth config, db client) requires the variables to exist.
    env:
      DATABASE_URL: postgresql://build:build@localhost:5432/build
      SERVICE_DATABASE_URL: postgresql://build:build@localhost:5432/build
      DIRECT_URL: postgresql://build:build@localhost:5432/build
      BETTER_AUTH_SECRET: ci-build-only-secret
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run -w @wezesha/db db:generate

      - name: Build (apps/web)
        run: npm run -w web build

  services-typecheck:
    name: services — typecheck packages, ws-gateway, worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Prisma client (worker imports @wezesha/db)
        run: npm run -w @wezesha/db db:generate

      - name: Typecheck @wezesha/realtime
        run: npm run -w @wezesha/realtime typecheck

      - name: Typecheck @wezesha/forecast
        run: npm run -w @wezesha/forecast typecheck

      - name: Typecheck @wezesha/queue
        run: npm run -w @wezesha/queue typecheck

      - name: Typecheck @wezesha/shopify
        run: npm run -w @wezesha/shopify typecheck

      - name: Typecheck @wezesha/observability
        run: npm run -w @wezesha/observability typecheck

      - name: Tests @wezesha/observability (mocked transport — no infra)
        run: npm run -w @wezesha/observability test

      - name: Typecheck @wezesha/ws-gateway
        run: npm run -w @wezesha/ws-gateway typecheck

      - name: Typecheck @wezesha/worker
        run: npm run -w @wezesha/worker typecheck

  docker-build:
    name: docker — service images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ws-gateway image
        run: docker build -f apps/ws-gateway/Dockerfile -t wezesha-ws-gateway:ci .

      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile -t wezesha-worker:ci .
