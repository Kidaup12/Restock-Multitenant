# Full local prototype topology — the pre-prod rehearsal. Overrides the base
# compose (db + redis) with the three app services built from their Dockerfiles,
# networked by service name exactly as the prod split will be.
#
#   cp .env.staging.example .env.staging     # adjust host ports if taken
#   docker compose --env-file .env.staging \
#     -f docker-compose.yml -f docker-compose.staging.yml up -d --build
#
# Kept separate from docker-compose.yml on purpose: the base file stays the
# lightweight dev-infra stack (`docker compose up -d db redis`), and staging is
# an explicit opt-in. Host ports are env-overridable because local machines
# often have the defaults taken.

services:
  db:
    ports: !override
      - "${DB_PORT:-5434}:5432"

  redis:
    ports: !override
      - "${REDIS_PORT:-6380}:6379"

  ws-gateway:
    build:
      context: .
      dockerfile: apps/ws-gateway/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      WS_DEV_TOKEN: ${WS_DEV_TOKEN:-staging-dev-token}
      # Session-backed socket auth reads sessions/memberships via @wezesha/db.
      DATABASE_URL: postgresql://wezesha_app:wezesha_app_dev@db:5432/wezesha
      SERVICE_DATABASE_URL: postgresql://wezesha_service:wezesha_service_dev@db:5432/wezesha
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${WS_GATEWAY_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://wezesha_app:wezesha_app_dev@db:5432/wezesha
      SERVICE_DATABASE_URL: postgresql://wezesha_service:wezesha_service_dev@db:5432/wezesha
      # Dev-only key for the staging rehearsal; real environments use the vault.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      # web imports @wezesha/db: client.ts throws at import when
      # SERVICE_DATABASE_URL is unset, and the app client reads DATABASE_URL —
      # same in-network roles as the worker/ws-gateway services above.
      DATABASE_URL: postgresql://wezesha_app:wezesha_app_dev@db:5432/wezesha
      SERVICE_DATABASE_URL: postgresql://wezesha_service:wezesha_service_dev@db:5432/wezesha
      # Better Auth signs sessions; the image runs NODE_ENV=production, where a
      # missing secret fails module init. Dev-only value for the rehearsal.
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-staging-dev-secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Shopify token crypto — same key as the worker so the OAuth callback
      # (web) and the sync (worker) agree on the at-rest encryption.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      SHOPIFY_APP_URL: ${SHOPIFY_APP_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      ws-gateway:
        condition: service_started
